<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>EVE Dashboard</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#21262d; --band:#11161d; --border:#2a323d; --line:#21262d;
    --text:#e6edf3; --muted:#9aa6b2; --accent:#4fb3ff; --accent-dim:#16364f;
    --ok:#3fb950; --ok-dim:#12301b; --warn:#e3b341; --warn-dim:#3a2e0f; --bad:#f85149; --bad-dim:#3d1414;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
  .wrap{max-width:1440px;margin:0 auto}
  a{color:var(--accent)}
  button,select,input{font:inherit;color:var(--text)}
  button{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
  button:active{transform:scale(.98)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
  button.link{background:none;border:none;padding:4px 6px;color:var(--muted);min-height:0}
  button.danger{color:var(--bad)}
  select,input{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-height:40px}
  .muted{color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px}
  header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  header.top h1{font-size:20px;font-weight:600;margin:0}
  .actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .sync{font-size:12px;color:var(--muted);margin-right:4px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap;display:inline-block}
  .chip.sm{font-size:11px;padding:2px 8px}
  .c-ok{background:var(--ok-dim);color:var(--ok)} .c-warn{background:var(--warn-dim);color:var(--warn)}
  .c-bad{background:var(--bad-dim);color:var(--bad)} .c-info{background:var(--accent-dim);color:var(--accent)}
  .c-mute{background:var(--card2);color:var(--muted)}
  .attention{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
  .attention b{font-size:13px;font-weight:600;margin-right:2px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
  .tile{padding:10px 14px}
  .tile span{display:block;font-size:12px;color:var(--muted)} .tile strong{font-size:19px;font-weight:600;display:block}
  .tile strong.small{font-size:15px;margin:2px 0}
  .slotrows{margin-top:4px;font-size:17px;font-weight:600;line-height:1.35}
  .slotrows div{display:flex;justify-content:space-between;gap:12px} .slotrows span{display:inline;font-size:inherit;color:inherit}
  .slots{display:flex;flex-wrap:wrap;gap:10px;font-weight:600} .tile .slots{font-size:15px;margin-top:4px} .slot{white-space:nowrap}
  .chip.lbl{background:transparent;border:1px solid;justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  details.sec{border-top:1px solid var(--line);margin-top:10px}
  details.sec>summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;padding:10px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::before{content:"▸";font-size:11px} details.sec[open]>summary::before{content:"▾"}
  details.sec>summary .slots{font-size:12px;margin-left:auto}
  .subhead{font-size:12px;font-weight:600;margin:10px 0 2px}
  .clone{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0}
  .clonehead{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:2px 0 4px}
  .clonename{flex:1 1 150px;min-height:32px;padding:4px 8px;font-size:13px}
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;flex-wrap:wrap}
  .main{display:flex;gap:16px;align-items:flex-start}
  #overview{flex:1;min-width:0;overflow-x:auto}
  #detail{flex:0 0 400px;padding:16px;display:none}
  body.has-detail #detail{display:block}
  .row,.thead{display:grid;grid-template-columns:36px minmax(140px,1.2fr) minmax(150px,1.3fr) 105px 160px 80px minmax(120px,1fr) minmax(95px,.8fr) 115px;
    gap:10px;align-items:center;padding:8px 12px}
  .thead{font-size:12px;color:var(--muted);padding-top:10px;padding-bottom:10px}
  .row{border-top:1px solid var(--line);color:var(--text);text-decoration:none;font-size:13px;min-height:52px}
  .row:hover,.row.sel{background:#1a212a}
  .row{border-left:4px solid transparent} .thead{border-left:4px solid transparent}
  .row .nm{font-size:14px;font-weight:500}
  .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;background:var(--band);border-top:1px solid var(--border);font-size:13px}
  .group strong{font-weight:600}
  .portrait{width:32px;height:32px;border-radius:50%;background:var(--card2);object-fit:cover;display:block}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
  .st{display:flex;align-items:center;gap:6px;min-width:0}
  .m{display:none}
  .bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:6px 0}
  .bar>div{height:100%;background:var(--accent);width:0}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
  .kv span:first-child{color:var(--muted)} .kv span:last-child{text-align:right;min-width:0}
  #detail h2{font-size:17px;margin:0} #detail h3{font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 4px}
  .dhead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
  .dhead img{width:56px;height:56px;border-radius:50%;background:var(--card2)}
  .back{display:none;margin-bottom:10px}
  .readystack{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
  .readystack .chip b{font-weight:700}
  a.chip:hover{filter:brightness(1.2)}
  .catkey{display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-size:13px;margin:-2px 0 10px}
  .catitem{display:inline-flex;align-items:center;gap:6px} .swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
  details.job>summary{cursor:pointer;list-style:none} details.job>summary::-webkit-details-marker{display:none}
  details.job>summary>span:first-child::before{content:"▸ ";color:var(--muted);font-size:11px} details.job[open]>summary>span:first-child::before{content:"▾ "}
  .jobinfo{margin:0 0 6px 14px;padding-left:10px;border-left:2px solid var(--line)} .jobinfo .kv{font-size:12px;padding:4px 0}
  #toasts{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:10;max-width:min(360px,calc(100vw - 32px))}
  .toast{background:var(--card2);border:1px solid var(--border);border-left:4px solid;border-radius:8px;padding:10px 14px;color:var(--text);text-decoration:none;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  .closebtn{float:right;min-height:36px;width:36px;padding:0;font-size:18px;line-height:1}
  .err{font-size:13px;color:var(--bad);margin:8px 0}
  .empty{text-align:center;padding:40px 16px}
  .settings{padding:16px;max-width:760px}
  .settings h2{font-size:17px;margin:0 0 4px} .settings h3{font-size:14px;margin:20px 0 6px}
  .srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .srow label{flex:1 1 180px;font-size:14px}
  .srow input{flex:0 1 220px}
  @media (max-width:900px){
    .thead{display:none}
    .row{grid-template-columns:36px 1fr auto;gap:10px}
    .row .d{display:none}
    .m{display:flex}
    body.has-detail #overview, body.has-detail .attention, body.has-detail .tiles, body.has-detail .toolbar{display:none}
    #detail{flex:1 1 auto;width:100%}
    .main{display:block}
    .back{display:inline-block}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>EVE Dashboard</h1>
    <div class="actions">
      <span class="sync" id="synced"></span>
      <button class="link" id="refreshBtn" aria-label="Refresh now">⟳ Refresh</button>
      <button id="settingsBtn">Accounts</button>
      <button id="addBtn">+ Add character</button>
    </div>
  </header>
  <div class="err" id="globalErr"></div>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
</div>

<script>
/* ---------- Config ---------- */
const CLIENT_ID = "28bb45097b894b8fa8885427fd253f28";
// Scopes requested at login. Only ask for scopes ticked on the developer portal.
// Every scope enabled on the app (read + action) is requested up front so new modules don't need a re-login.
const SCOPES = [
  // action scopes (approved by owner 2026-11-13)
  "esi-ui.open_window.v1", "esi-ui.write_waypoint.v1",
  "esi-calendar.respond_calendar_events.v1", "esi-fleets.write_fleet.v1",
  "esi-fittings.write_fittings.v1", "esi-mail.organize_mail.v1",
  "esi-characters.write_contacts.v1", "esi-mail.send_mail.v1",
  "publicData",
  // skills, clones, character
  "esi-skills.read_skills.v1", "esi-skills.read_skillqueue.v1",
  "esi-clones.read_clones.v1", "esi-clones.read_implants.v1",
  "esi-characters.read_contacts.v1", "esi-characters.read_loyalty.v1",
  "esi-characters.read_chat_channels.v1", "esi-characters.read_medals.v1",
  "esi-characters.read_standings.v1", "esi-characters.read_agents_research.v1",
  "esi-characters.read_blueprints.v1", "esi-characters.read_corporation_roles.v1",
  "esi-characters.read_fatigue.v1", "esi-characters.read_notifications.v1",
  "esi-characters.read_titles.v1", "esi-characters.read_fw_stats.v1",
  "esi-characters.read_freelance_jobs.v1",
  // location, wallet, assets, industry, markets, contracts
  "esi-location.read_location.v1", "esi-location.read_ship_type.v1", "esi-location.read_online.v1",
  "esi-wallet.read_character_wallet.v1", "esi-assets.read_assets.v1",
  "esi-industry.read_character_jobs.v1", "esi-industry.read_character_mining.v1",
  "esi-markets.read_character_orders.v1", "esi-markets.structure_markets.v1",
  "esi-contracts.read_character_contracts.v1",
  // other character reads
  "esi-calendar.read_calendar_events.v1", "esi-mail.read_mail.v1",
  "esi-killmails.read_killmails.v1", "esi-fittings.read_fittings.v1",
  "esi-planets.manage_planets.v1", /* despite the name, ESI only offers read routes for this */
  "esi-fleets.read_fleet.v1",
  "esi-search.search_structures.v1", "esi-universe.read_structures.v1",
  "esi-structures.read_character.v1", "esi-activities.read_character.v1",
  "esi-access.read_lists.v1", "esi.activity.char:read", "esi.cosmetic.char:read",
  // corporation / alliance reads (only return data if the character has the corp roles)
  "esi-wallet.read_corporation_wallet.v1", "esi-wallet.read_corporation_wallets.v1",
  "esi-corporations.read_corporation_membership.v1", "esi-corporations.read_structures.v1",
  "esi-corporations.track_members.v1", "esi-corporations.read_divisions.v1",
  "esi-corporations.read_contacts.v1", "esi-corporations.read_titles.v1",
  "esi-corporations.read_blueprints.v1", "esi-corporations.read_standings.v1",
  "esi-corporations.read_starbases.v1", "esi-corporations.read_container_logs.v1",
  "esi-corporations.read_facilities.v1", "esi-corporations.read_medals.v1",
  "esi-corporations.read_fw_stats.v1", "esi-corporations.read_projects.v1",
  "esi-corporations.read_freelance_jobs.v1", "esi-structures.read_corporation.v1",
  "esi-killmails.read_corporation_killmails.v1", "esi-assets.read_corporation_assets.v1",
  "esi-contracts.read_corporation_contracts.v1", "esi-industry.read_corporation_jobs.v1",
  "esi-industry.read_corporation_mining.v1", "esi-markets.read_corporation_orders.v1",
  "esi-planets.read_customs_offices.v1", "esi-alliances.read_contacts.v1"
];
const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, "");   // register this exact URL as the Callback URL
const SSO = "https://login.eveonline.com/v2/oauth";
const ESI = "https://esi.evetech.net";
const COMPAT_DATE = "2020-01-01";
// ESI best practice: identify the app. Browsers can't set User-Agent, so ESI accepts X-User-Agent.
const APP_ID = "EVE-Dashboard/1.8 (+https://github.com/DuncanSmithMT/EVE-Dashboard)";
const REFRESH_MS = 5 * 60 * 1000;

/* ---------- Storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
let chars = store.get("eve.chars", {});           // id -> {id,name,access,refresh,expires}

/* ---------- PKCE helpers ---------- */
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const randStr = n => b64url(crypto.getRandomValues(new Uint8Array(n)));
async function sha256(s){ return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); }
function parseJwt(t){
  const p = t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
  return JSON.parse(decodeURIComponent(escape(atob(p))));
}

async function startLogin(){
  const verifier = randStr(32), state = randStr(16);
  store.set("eve.pkce", {verifier, state});
  const challenge = b64url(await sha256(verifier));
  const q = new URLSearchParams({
    response_type:"code", redirect_uri:REDIRECT_URI, client_id:CLIENT_ID,
    scope:SCOPES.join(" "), code_challenge:challenge, code_challenge_method:"S256", state
  });
  location.href = `${SSO}/authorize?${q}`;
}

async function tokenRequest(params){
  const r = await fetch(`${SSO}/token`, {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({...params, client_id:CLIENT_ID})
  });
  if(!r.ok) throw Object.assign(new Error(`Login service returned ${r.status}`), {status:r.status});
  return r.json();
}

function saveTokens(tok){
  const claims = parseJwt(tok.access_token);
  const id = claims.sub.split(":").pop();
  chars[id] = { id, name:claims.name, access:tok.access_token, refresh:tok.refresh_token,
                expires:Date.now() + (tok.expires_in - 60) * 1000 };
  store.set("eve.chars", chars);
  return id;
}

async function handleCallback(){
  const p = new URLSearchParams(location.search);
  if(p.has("error")){ store.del("eve.pkce"); history.replaceState(null, "", REDIRECT_URI); throw new Error("Login was cancelled or refused."); }
  if(!p.has("code")) return;
  const saved = store.get("eve.pkce", {});
  history.replaceState(null, "", REDIRECT_URI);
  if(p.get("state") !== saved.state) throw new Error("Login check failed (state mismatch). Try adding the character again.");
  const tok = await tokenRequest({grant_type:"authorization_code", code:p.get("code"), code_verifier:saved.verifier});
  store.del("eve.pkce");
  saveTokens(tok);
}

const pendingRefresh = {};   // one refresh per character at a time (EVE rotates refresh tokens)
function accessToken(c){
  if(Date.now() < c.expires) return Promise.resolve(c.access);
  return pendingRefresh[c.id] ||= (async () => {
    const tok = await tokenRequest({grant_type:"refresh_token", refresh_token:c.refresh});
    if(!chars[c.id]) return tok.access_token;   // removed while refreshing: don't re-add
    saveTokens(tok);
    return chars[c.id].access;
  })().finally(() => delete pendingRefresh[c.id]);
}

/* ---------- App data ---------- */
const names = store.get("eve.names", {});          // id -> name (skills, ships, systems, stations, corps, structures "s<id>")
let meta = store.get("eve.meta", {accountOf:{}, omega:{}});   // manual: character -> account label, account -> Omega expiry (YYYY-MM-DD)
let sortBy = store.get("eve.sort", "account");
const data = {};                                   // id -> {queue, skills, wallet, location, ship, corpId, error}

/* ---------- ESI ---------- */
// When EVE says slow down (420/429), is down (502-504), or we're close to its error limit,
// stop ALL calls until it says we can resume. Nothing is sent while paused.
let pausedUntil = 0, pauseReason = "";
function pause(seconds, why){
  const until = Date.now() + Math.max(seconds || 60, 10) * 1000;
  if(until > pausedUntil){ pausedUntil = until; pauseReason = why; }
}
const isPaused = () => Date.now() < pausedUntil;

async function esi(path, token, opts={}){
  if(isPaused()) throw Object.assign(new Error("Paused: " + pauseReason), {status:"paused"});
  const headers = {"X-Compatibility-Date":COMPAT_DATE, "X-User-Agent":APP_ID, "Accept":"application/json"};
  if(token) headers.Authorization = `Bearer ${token}`;
  if(opts.body) headers["Content-Type"] = "application/json";
  const r = await fetch(ESI + path, {method:opts.method||"GET", headers, body:opts.body});
  const errRemain = r.headers.get("x-esi-error-limit-remain"), errReset = +r.headers.get("x-esi-error-limit-reset");
  if(errRemain !== null && +errRemain <= 10) pause(errReset, "close to EVE's error limit");
  if(r.status === 420) pause(errReset, "EVE's error limit was reached");
  else if(r.status === 429) pause(+r.headers.get("retry-after"), "EVE's rate limit was reached");
  else if(r.status >= 502 && r.status <= 504) pause(60, "EVE's servers are having problems");
  if(!r.ok) throw Object.assign(new Error(`EVE returned ${r.status} for ${path.split("/").filter(Boolean).slice(-1)[0]}`), {status:r.status});
  if(opts.pg) opts.pg.pages = +r.headers.get("x-pages") || 1;
  return r.json();
}

async function resolveNames(ids){
  const missing = [...new Set(ids.filter(Boolean))].filter(id => !names[id]);
  for(let i=0;i<missing.length;i+=500){
    const chunk = missing.slice(i,i+500);
    try{
      const res = await esi("/universe/names", null, {method:"POST", body:JSON.stringify(chunk)});
      res.forEach(n => names[n.id] = n.name);
    }catch(e){
      // a single unknown ID makes the whole batch 404: only then fall back to one at a time
      if(e.status !== 404) return;
      for(const id of chunk){
        try{ const [n] = await esi("/universe/names", null, {method:"POST", body:JSON.stringify([id])}); names[n.id] = n.name; }
        catch(e){ if(e.status === 404) names[id] = "Unknown"; else break; }
      }
    }
  }
  store.set("eve.names", names);
}

// names["s"+id] = structure name, names["y"+id] = solar system of a station/structure (0 = unknown)
async function resolveStructure(id, token){
  const key = "s" + id;
  if(names[key] && ("y" + id) in names) return;
  try{ const st = await esi(`/universe/structures/${id}`, token); names[key] = st.name; names["y"+id] = st.solar_system_id || 0; }
  catch(e){ if(e.status === 403 || e.status === 404){ names[key] = "Player structure"; names["y"+id] = 0; } else return; }   // no docking access: don't keep retrying
  store.set("eve.names", names);
}
async function resolveStation(id){
  if(("y" + id) in names) return;
  try{ const st = await esi(`/universe/stations/${id}`, null); names[id] = st.name; names["y"+id] = st.system_id || 0; }   // public, never changes
  catch(e){ if(e.status === 404){ names["y"+id] = 0; } else return; }
  store.set("eve.names", names);
}
// where an industry job runs: a station (below 100 million) or a player structure
async function resolveFacilities(jobs, token){
  for(const id of [...new Set(jobs.map(j => j.facility_id).filter(Boolean))]){
    if(id >= 1e12) await resolveStructure(id, token); else await resolveStation(id);
  }
  await resolveNames(jobs.map(j => names["y" + j.facility_id]).filter(Boolean));
}

// System cost indices (public, about 2 MB, EVE refreshes hourly): only loaded when a character's industry is opened
let sysIndex = null, sysIndexAt = 0, sysIndexReq = null, sysIndexFailAt = 0;
const indicesFresh = () => (sysIndex && Date.now() - sysIndexAt < 36e5) || Date.now() - sysIndexFailAt < 5 * 6e4;   // failed: wait 5 min
function loadIndices(){
  if(indicesFresh()) return Promise.resolve();
  return sysIndexReq ||= esi("/industry/systems", null).then(list => {
    sysIndex = Object.fromEntries(list.map(sy => [sy.solar_system_id, Object.fromEntries(sy.cost_indices.map(c => [c.activity, c.cost_index]))]));
    sysIndexAt = Date.now();
  }).catch(() => { sysIndexFailAt = Date.now(); }).finally(() => { sysIndexReq = null; });
}

const refused = {};   // "<charId>:<route>" -> true after a 403, so it isn't retried every refresh this session
function extra(c, route, fn){
  const key = c.id + ":" + route;
  if(refused[key]) return Promise.resolve(null);
  return fn().catch(e => { if(e.status === 403) refused[key] = true; throw e; });
}

async function loadChar(c){
  if(isPaused()) return;                       // keep last good data; try again after the pause
  if(data[c.id]?.authError) return;            // needs "Sign in again"; don't keep sending failing requests
  try{
    const t = await accessToken(c);
    const [queue, skills] = await Promise.all([
      esi(`/characters/${c.id}/skillqueue`, t),
      esi(`/characters/${c.id}/skills`, t)
    ]);
    // extras: a failure here shouldn't hide the skill queue
    const [wallet, location, ship, pub, jobs, clones, fatigue, implants, roles, online] = (await Promise.allSettled([
      extra(c, "wallet",   () => esi(`/characters/${c.id}/wallet`, t)),
      extra(c, "location", () => esi(`/characters/${c.id}/location`, t)),
      extra(c, "ship",     () => esi(`/characters/${c.id}/ship`, t)),
      esi(`/characters/${c.id}`, null),         // public, cached 24h by EVE (the browser serves repeats from its cache)
      extra(c, "jobs",     () => esi(`/characters/${c.id}/industry/jobs`, t)),   // EVE cache 5 min
      extra(c, "clones",   () => esi(`/characters/${c.id}/clones`, t)),
      extra(c, "fatigue",  () => esi(`/characters/${c.id}/fatigue`, t)),         // EVE cache 5 min
      extra(c, "implants", () => esi(`/characters/${c.id}/implants`, t)),
      extra(c, "roles",    () => esi(`/characters/${c.id}/roles`, t)),           // EVE cache 1h: who may read corp industry jobs
      extra(c, "online",   () => esi(`/characters/${c.id}/online`, t))           // last login / logout, online now
    ])).map(r => r.status === "fulfilled" ? r.value : null);
    queue.sort((a,b) => a.queue_position - b.queue_position);
    if(location?.structure_id) await resolveStructure(location.structure_id, t);
    const jcs = clones?.jump_clones || [];
    for(const j of jcs) if(j.location_type === "structure") await resolveStructure(j.location_id, t);
    const allImplants = [...(implants||[]), ...jcs.flatMap(j => j.implants || [])];
    await resolveNames([...queue.map(q => q.skill_id), ship?.ship_type_id, location?.solar_system_id,
                        location?.station_id, pub?.corporation_id,
                        ...(jobs||[]).map(j => j.product_type_id || j.blueprint_type_id), ...allImplants,
                        ...jcs.filter(j => j.location_type === "station").map(j => j.location_id)]);
    await resolveSlots(allImplants);
    if(jobs) await resolveFacilities(jobs, t);
    const prev = data[c.id] || {};             // a failed extra keeps showing its last good value
    if(chars[c.id]) data[c.id] = {queue, skills,   // (also clears any old error)
      wallet: wallet ?? prev.wallet, location: location ?? prev.location, ship: ship ?? prev.ship,
      corpId: pub?.corporation_id ?? prev.corpId, jobs: jobs ?? prev.jobs, clones: clones ?? prev.clones,
      fatigue: fatigue ?? prev.fatigue, implants: implants ?? prev.implants, roles: roles ?? prev.roles, online: online ?? prev.online};
  }catch(e){
    if(e.status === "paused") return;          // not this character's fault; keep last good data
    const auth = [400,401,403].includes(e.status);
    if(chars[c.id]) data[c.id] = {...(data[c.id]||{}), error:e.message, authError:auth};
  }
}

// Jobs run with corporation blueprints/hangars are owned by the corporation, not the character, and only appear in
// the corporation's job list. EVE lets a character with the Factory Manager role (or a director) read that list.
// One call per corporation per refresh; only jobs installed by characters on this dashboard are kept.
const corpJobs = {};   // corporation id -> jobs installed by this dashboard's characters
async function loadCorpJobs(){
  const byCorp = {};
  for(const id of Object.keys(chars)){
    const d = data[id];
    if(!d?.corpId || d.authError) continue;
    const roles = d.roles?.roles || [];
    if(roles.includes("Factory_Manager") || roles.includes("Director")) (byCorp[d.corpId] ||= []).push(chars[id]);
  }
  for(const k of Object.keys(corpJobs)) if(!byCorp[k]) delete corpJobs[k];   // nobody can read that corporation any more
  for(const [corpId, readers] of Object.entries(byCorp)){
    let allRefused = true;
    for(const c of readers){
      if(isPaused()) return;
      if(refused[c.id + ":corpjobs"]) continue;
      try{
        const t = await accessToken(c), pg = {}, path = `/corporations/${corpId}/industry/jobs`;
        let jobs = await esi(path, t, {pg});
        for(let p = 2; p <= pg.pages; p++) jobs = jobs.concat(await esi(`${path}?page=${p}`, t));
        const ids = new Set();                   // a job can repeat across pages if the list shifts between requests
        const mine = jobs.filter(j => chars[j.installer_id] && !ids.has(j.job_id) && ids.add(j.job_id));
        await resolveNames(mine.map(j => j.product_type_id || j.blueprint_type_id));
        await resolveFacilities(mine, t);
        corpJobs[corpId] = mine;
        allRefused = false;
        break;                                   // one reader per corporation is enough
      }catch(e){
        if(e.status === 403) refused[c.id + ":corpjobs"] = true;   // try the corporation's next reader
        else { allRefused = false; break; }      // paused / EVE trouble: keep the last good list
      }
    }
    if(allRefused) delete corpJobs[corpId];
  }
}

// Implant slot numbers (1-10) come from each implant type's "implantness" attribute (dogma attribute 331).
// Public data that never changes: looked up once per implant type and stored on the device.
const slots = store.get("eve.slots", {}), slotReq = {};
async function resolveSlots(ids){
  for(const id of [...new Set(ids)].filter(id => !(id in slots))){
    if(isPaused()) return;
    try{
      await (slotReq[id] ||= esi(`/universe/types/${id}`, null)       // shared, so parallel characters don't repeat it
        .then(t => { slots[id] = (t.dogma_attributes || []).find(a => a.attribute_id === 331)?.value || 0; })
        .catch(e => { if(e.status === 404) slots[id] = 0; throw e; })
        .finally(() => delete slotReq[id]));
    }catch(e){ if(e.status !== 404) break; }
  }
  store.set("eve.slots", slots);
}

// a few characters at a time, so 28+ characters don't flood EVE with requests
async function pool(items, n, fn){
  const q = [...items];
  await Promise.all(Array.from({length:Math.min(n, q.length)}, async () => { while(q.length) await fn(q.shift()); }));
}

let lastSync = 0, syncing = false;
async function refreshAll(){
  if(syncing) return;
  syncing = true;
  const live = () => { if(route().view !== "accounts") safeRender(); };   // re-rendering the Accounts page would wipe what's being typed
  let ran = 0;
  try{
    await pool(Object.values(chars), 4, async c => { if(!isPaused()) { ran++; await loadChar(c); live(); } });
    await loadCorpJobs();
  }
  finally{
    syncing = false;
    if(ran) lastSync = Date.now();   // a refresh skipped entirely by a pause doesn't count as fresh data
    schedulePoll();                  // always re-arm, even if drawing the page failed
  }
  live();
}

// Next refresh 5 minutes after this one finished (or when a pause ends, if later).
// If the page is hidden when the timer fires, nothing is sent until it's opened again.
let pollTimer;
function schedulePoll(){
  clearTimeout(pollTimer);
  const wait = Math.max(REFRESH_MS, pausedUntil - Date.now() + 1000);
  pollTimer = setTimeout(() => { if(!document.hidden) refreshAll(); }, wait);
}

/* ---------- Derived values ---------- */
const ROMAN = ["","I","II","III","IV","V"];
const DAY = 864e5, HOUR = 36e5;
const fmtSP = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? Math.round(n/1e3)+"k" : String(n);
const fmtISK = v => v == null ? "—" : v >= 1e12 ? (v/1e12).toFixed(2)+"T" : v >= 1e9 ? (v/1e9).toFixed(2)+"B" : v >= 1e6 ? (v/1e6).toFixed(1)+"M" : Math.round(v).toLocaleString();
function fmtDur(ms){
  if(ms <= 0) return "done";
  const d=Math.floor(ms/DAY), h=Math.floor(ms%DAY/HOUR), m=Math.floor(ms%HOUR/6e4), s=Math.floor(ms%6e4/1e3);
  return d ? `${d}d ${h}h ${m}m` : h ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const skillLabel = q => `${names[q.skill_id] || "Skill " + q.skill_id} ${ROMAN[q.finished_level] || ""}`;
const accountOf = id => meta.accountOf[id] || "";
meta.accountOrder ||= {}; meta.charOrder ||= {}; meta.charLabel ||= {}; meta.labelColor ||= {}; meta.cloneNames ||= {};

// Settings you may want to tweak
const QUEUE_WARN_DAYS = 33;   // "Needs attention" when an account's skill queue has less than this left

// Display order you set on the Accounts page: numbered first (ascending), then unnumbered A–Z; "Unassigned" last.
const num = v => (v === undefined || v === null || v === "" || isNaN(v)) ? Infinity : +v;
function compareAccounts(a, b){
  if(!a || !b) return !a && !b ? 0 : !a ? 1 : -1;
  return num(meta.accountOrder[a]) - num(meta.accountOrder[b]) || a.localeCompare(b, undefined, {numeric:true});
}
function compareChars(a, b){   // a, b: character ids
  return num(meta.charOrder[a]) - num(meta.charOrder[b]) || chars[a].name.localeCompare(chars[b].name);
}

// Character labels: free text, each label has one color chosen on the Accounts page
const LABEL_COLORS = {blue:"#4fb3ff", green:"#3fb950", amber:"#e3b341", red:"#f85149", purple:"#a78bfa", gray:"#9aa6b2"};
const labelOf = id => meta.charLabel[id] || "";
const labelColor = l => LABEL_COLORS[meta.labelColor[l]] || LABEL_COLORS.gray;
const labelChip = l => l ? `<span class="chip sm lbl" style="color:${labelColor(l)};border-color:${labelColor(l)}">${esc(l)}</span>` : "";

// Industry: three job types, colored like the game (manufacturing yellow, research blue, reactions teal)
const CATS = [{k:"M", name:"Manufacturing", color:"#e3b341"}, {k:"R", name:"Research", color:"#4fb3ff"}, {k:"Re", name:"Reactions", color:"#2ec4b6"}];
const CAT_OF = {1:"M", 3:"R", 4:"R", 5:"R", 7:"R", 8:"R", 9:"Re", 11:"Re"};
const CAT_COLOR = Object.fromEntries(CATS.map(c => [c.k, c.color]));
// Job slots: 1 base + 1 per level of each of the two skills for that type
const SLOT_SKILLS = {M:[3387, 24625], R:[3406, 24624], Re:[45748, 45749]};
const ACTIVITY = {1:"Manufacturing", 3:"TE research", 4:"ME research", 5:"Copying", 7:"Reverse engineering", 8:"Invention", 9:"Reaction", 11:"Reaction"};
const INFOMORPH_SYNC = 33399;   // skill: -1 hour per level on the 24h jump clone cooldown
const slotsHtml = (use, cap) => CATS.map(c => `<span class="slot" style="color:${c.color}" title="${c.name}">${c.k} ${use[c.k]}/${cap[c.k]}</span>`).join("");

// Jump clones: EVE doesn't share clone names or say which clone a character is in, so names are set on the dashboard
// and matched by implant set. The current clone is the one whose name matches the implants plugged in right now.
const cloneSig = implants => (implants || []).slice().sort((a,b) => a-b).join(",");
const cloneName = sig => sig ? (meta.cloneNames[sig] || "") : "";

function info(id){
  const d = data[id] || {}, now = Date.now();
  const r = {id, name:chars[id].name, error:d.error, authError:d.authError, loading:!d.queue && !d.error, wallet:d.wallet,
             freeSP:d.skills?.unallocated_sp || 0, totalSP:d.skills?.total_sp, account:accountOf(id), label:labelOf(id),
             corp:names[d.corpId] || "", system:names[d.location?.solar_system_id] || "",
             ship:names[d.ship?.ship_type_id] || "", shipName:d.ship?.ship_name || ""};
  r.groupKey = r.account || "#" + id;   // characters without an account count as their own account
  r.docked = d.location?.station_id ? names[d.location.station_id] : d.location?.structure_id ? names["s"+d.location.structure_id] : "";
  if([r.ship, `${r.ship} - ${r.name}`, `${r.name}'s ${r.ship}`].includes(r.shipName)) r.shipName = "";

  // industry: ready = EVE says ready, or an active job whose end time has passed. Ready jobs still hold their slot.
  const own = d.jobs || [], seen = new Set(own.map(j => j.job_id));
  const viaCorp = Object.values(corpJobs).flat().filter(j => j.installer_id === +id && !seen.has(j.job_id)).map(j => ({...j, corp:true}));
  r.jobs = [...own, ...viaCorp].map(j => {
    const end = Date.parse(j.end_date);
    const state = j.status === "ready" || (j.status === "active" && end <= now) ? "ready" : j.status === "active" ? "active" : j.status;
    const fac = j.facility_id, sys = names["y" + fac];
    return {state, end, runs:j.runs, corp:!!j.corp, cat:CAT_OF[j.activity_id] || "M", activityId:j.activity_id, activity:ACTIVITY[j.activity_id] || "Industry", item:names[j.product_type_id || j.blueprint_type_id] || "Item",
            id:j.job_id, start:Date.parse(j.start_date), cost:j.cost, licensed:j.licensed_runs, probability:j.probability,
            facility: !fac ? "—" : fac >= 1e12 ? names["s" + fac] || "Player structure" : names[fac] || "Station", systemId: sys || 0, system: sys ? names[sys] || "" : ""};
  }).filter(j => ["ready","active","paused"].includes(j.state));
  r.jobsReady = r.jobs.filter(j => j.state === "ready").length;
  r.jobsActive = r.jobs.filter(j => j.state === "active").length;
  r.nextJob = Math.min(...r.jobs.filter(j => j.state === "active").map(j => j.end));   // Infinity if none
  r.hasJobs = !!d.jobs;
  r.slotUse = {M:0, R:0, Re:0}; r.jobs.forEach(j => r.slotUse[j.cat]++);
  if(d.skills){
    const lvl = sid => d.skills.skills?.find(s => s.skill_id === sid)?.active_skill_level || 0;
    r.slotCap = Object.fromEntries(Object.entries(SLOT_SKILLS).map(([k, [a, b]]) => [k, 1 + lvl(a) + lvl(b)]));
  }

  // jump clone: 24h minus 1h per Infomorph Synchronizing level, from the last clone jump
  if(d.clones && d.skills){
    const lvl = d.skills.skills?.find(s => s.skill_id === INFOMORPH_SYNC)?.active_skill_level || 0;
    r.jcHours = 24 - lvl;
    const last = Date.parse(d.clones.last_clone_jump_date);
    r.jcReadyAt = last ? last + r.jcHours * HOUR : 0;
    r.jumpClones = (d.clones.jump_clones || []).map(j => ({id:j.jump_clone_id, implants:j.implants || [], sig:cloneSig(j.implants),
      location: j.location_type === "structure" ? names["s"+j.location_id] || "Player structure" : names[j.location_id] || "Station"}));
    r.jcCount = r.jumpClones.length;
  }
  r.activeSig = d.implants ? cloneSig(d.implants) : null;
  r.activeClone = r.activeSig === null ? "" : r.activeSig === "" ? "No implants" : cloneName(r.activeSig);

  // jump timers: blue = fatigue (from EVE); red = jump activation. Red isn't provided: it's 1/10 of the fatigue
  // you had before the jump, so 1/10 of the fatigue after the jump is a guaranteed "clear by" time.
  if(d.fatigue?.jump_fatigue_expire_date){
    r.blueEnd = Date.parse(d.fatigue.jump_fatigue_expire_date);
    const from = Date.parse(d.fatigue.last_update_date || d.fatigue.last_jump_date);
    if(from && r.blueEnd > from) r.redEnd = from + (r.blueEnd - from) / 10;
  }
  r.hasFatigue = !!d.fatigue;
  r.online = d.online;
  r.blueLeft = r.blueEnd > now ? r.blueEnd - now : 0;
  r.redLeft = r.redEnd > now ? r.redEnd - now : 0;
  r.implants = (d.implants || []).map(i => ({name:names[i] || "Implant " + i, slot:slots[i] || 0})).sort((a,b) => a.slot - b.slot);
  r.hasImplants = !!d.implants;

  if(r.error && (r.authError || !d.queue)){ r.status="bad"; r.label2=r.authError ? "Sign in again" : "Couldn't load, will retry"; r.queueEnd=-Infinity; return r; }
  if(r.loading){ r.status="mute"; r.label2="Loading…"; r.queueEnd=Infinity; return r; }
  const active = d.queue.filter(q => !q.finish_date || Date.parse(q.finish_date) > now);
  r.active = active;
  if(!active.length){ r.status="bad"; r.label2="Queue empty"; r.queueEnd=-1; }
  else if(!active[0].finish_date){ r.status="bad"; r.label2="Not training"; r.queueEnd=-1; r.next=skillLabel(active[0]); }
  else{
    r.cur = active[0]; r.training = skillLabel(r.cur);
    r.skillEnd = Date.parse(r.cur.finish_date); r.skillStart = Date.parse(r.cur.start_date) || now;
    r.queueEnd = Date.parse(active[active.length-1].finish_date);
    r.status = r.queueEnd - now < DAY ? "warn" : "ok";
    r.label2 = r.status === "warn" ? "Ends in < 24h" : "Training";
  }
  // skill points still needed to finish everything in the queue (current skill counted by time elapsed)
  let sp = 0, known = active.length > 0;
  for(const q of active){
    const end = q.level_end_sp, start = q.training_start_sp ?? q.level_start_sp;
    if(end == null || start == null){ known = false; break; }
    let left = end - start;
    const a = Date.parse(q.start_date), b = Date.parse(q.finish_date);
    if(q === r.cur && a && b && b > a) left *= Math.min(1, Math.max(0, (b - now) / (b - a)));
    sp += Math.max(0, left);
  }
  if(known) r.spLeft = Math.round(sp);
  return r;
}
const DOT = {ok:"var(--ok)", warn:"var(--warn)", bad:"var(--bad)", mute:"var(--muted)"};

// Accounts: one character training at a time is normal, so an account only needs attention when NONE of its
// characters is training. An account's queue = the longest queue among its training characters.
function accountSummary(all){
  const acc = {};
  for(const x of all){
    const a = acc[x.groupKey] ||= {key:x.groupKey, label:x.account || x.name, chars:[], queueEnd:-1, loaded:true};
    a.chars.push(x);
    if(x.loading || (x.error && !x.active)) a.loaded = false;
    if(x.cur) a.queueEnd = Math.max(a.queueEnd, x.queueEnd);
  }
  for(const a of Object.values(acc)){
    a.training = a.queueEnd > 0;
    a.stopped = a.loaded && !a.training;
    a.queueLeft = a.training ? a.queueEnd - Date.now() : 0;
  }
  return acc;
}
// A character that isn't training is only a problem when its whole account has stopped
function rowStatus(x, acc){
  if(x.status !== "bad" || x.error || !x.active) return x.status;
  return acc[x.groupKey]?.training ? "mute" : "bad";
}

// Omega gold, as the game shows Omega status
const OMEGA_GOLD = "#d9a520";
const isAlpha = l => meta.omega[l] === "alpha";
function omegaTile(all){
  const end = l => Date.parse(meta.omega[l] + "T11:00:00Z");
  const accounts = [...new Set(all.map(x => x.account).filter(Boolean))];
  const alphas = accounts.filter(isAlpha).sort(compareAccounts);
  // expired accounts are flagged in "Needs attention"; the tile shows the next one still to come
  const upcoming = accounts.filter(l => !isAlpha(l) && end(l) > Date.now()).sort((a,b) => end(a) - end(b));
  const alphaLine = alphas.length ? `<span>Alpha: ${alphas.map(esc).join(", ")}</span>` : "";
  if(!upcoming.length) return `<strong class="small">—</strong>${alphaLine || `<span><a href="#accounts">Set Omega dates</a></span>`}`;
  const l = upcoming[0], o = omegaInfo(l);
  return `<strong style="color:${OMEGA_GOLD}">${o.days} day${o.days === 1 ? "" : "s"}</strong><span>${esc(l)}</span>${alphaLine}`;
}

function omegaInfo(label){
  const date = meta.omega[label];
  if(!label || !date) return null;
  if(date === "alpha") return {cls:"c-mute", text:"Alpha"};
  const left = Date.parse(date + "T11:00:00Z") - Date.now();   // treat expiry as downtime (11:00 UTC) on that day
  if(left <= 0) return {cls:"c-bad", text:"Omega expired"};
  const days = Math.ceil(left / DAY);
  return {cls: days <= 7 ? "c-warn" : "c-ok", text:`Omega · ${days}d left`, days};
}

/* ---------- Toasts: jump timers finishing ---------- */
// Shown while the dashboard is open. Timers that finished before it was opened don't toast.
let toastSince = Date.now();
function checkTimerToasts(all){
  const now = Date.now();
  for(const x of all){
    if(x.redEnd > toastSince && x.redEnd <= now) toast(`${x.name}: jump activation (red) clear`, "var(--bad)", x.id);
    if(x.blueEnd > toastSince && x.blueEnd <= now) toast(`${x.name}: jump fatigue (blue) gone`, "var(--accent)", x.id);
    if(x.jcReadyAt > toastSince && x.jcReadyAt <= now) toast(`${x.name}: jump clone ready`, "var(--ok)", x.id);
  }
  toastSince = now;
}
function toast(text, color, id){
  const box = document.getElementById("toasts"); if(!box) return;
  const el = document.createElement("a");
  el.className = "toast"; el.href = "#c/" + id; el.style.borderLeftColor = color; el.textContent = text;
  el.onclick = () => el.remove();
  box.appendChild(el);
  setTimeout(() => el.remove(), 15000);
}

/* ---------- Rendering ---------- */
function route(){ const h = location.hash; return h.startsWith("#c/") ? {view:"detail", id:h.slice(3)} : h === "#accounts" ? {view:"accounts"} : {view:"overview"}; }

// Background redraws wait while you're typing in a box, so what you type isn't wiped
let pendingRender = false;
function safeRender(){
  if(document.activeElement?.tagName === "INPUT"){ pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if(pendingRender){ pendingRender = false; setTimeout(safeRender, 0); } });

let nextFinishTimer;
function render(){
  clearTimeout(nextFinishTimer);
  const app = document.getElementById("app"), ids = Object.keys(chars), r = route();
  document.body.classList.toggle("has-detail", r.view === "detail" && !!chars[r.id]);
  if(!ids.length){
    app.innerHTML = `<div class="card empty"><h2>No characters yet</h2>
      <p class="muted">Sign in with EVE Online to add your characters.</p>
      <button class="primary" onclick="startLogin()">Add your first character</button></div>`;
    return;
  }
  if(r.view === "accounts"){ app.innerHTML = accountsView(ids); return; }
  const all = ids.map(info), acc = accountSummary(all);
  checkTimerToasts(all);
  // industry drill-down needs system cost indices: load them (once an hour) when a character with jobs is open
  if(chars[r.id] && all.find(x => x.id === r.id)?.jobs.length && !indicesFresh() && !sysIndexReq) loadIndices().then(safeRender);
  app.innerHTML = attentionHtml(all, acc) + tilesHtml(all, acc) + toolbarHtml() + categoryKey() +
    `<div class="main"><div id="overview" class="card">${overviewHtml(all, acc, r.id)}</div>
     <aside id="detail" class="card">${chars[r.id] ? detailHtml(info(r.id)) : ""}</aside></div>`;
  // redraw (no EVE calls) when something changes state: a skill or job finishes, a timer runs out
  const now = Date.now();
  const ends = all.flatMap(x => [...(x.active||[]).map(q => Date.parse(q.finish_date)), ...x.jobs.filter(j => j.state === "active").map(j => j.end),
                                 x.jcReadyAt, x.blueEnd, x.redEnd]).filter(t => t > now);
  if(ends.length) nextFinishTimer = setTimeout(safeRender, Math.min(Math.min(...ends) - now + 1000, 2**31 - 1));
  tick();
}

function attentionHtml(all, acc){
  const n = f => all.filter(f).length, items = [], accs = Object.values(acc);
  const signin = n(x => x.authError), failing = n(x => x.error && !x.authError && x.status === "bad");
  const stopped = accs.filter(a => a.stopped);
  const short = accs.filter(a => a.training && a.queueLeft < QUEUE_WARN_DAYS * DAY).sort((a,b) => a.queueLeft - b.queueLeft);
  const labels = [...new Set(all.map(x => x.account).filter(Boolean))];
  const omegaSoon = labels.filter(l => { const o = omegaInfo(l); return o && (o.cls === "c-warn" || o.cls === "c-bad"); });
  // each item links to what needs attention: a character's details, the Accounts page, or the industry view
  const go = (href, cls, style, text) => `<a class="chip ${cls}" href="${href}" style="text-decoration:none;${style}">${text}</a>`;
  const firstOf = list => list.slice().sort((a,b) => compareChars(a.id, b.id))[0];
  const signers = all.filter(x => x.authError), fails = all.filter(x => x.error && !x.authError && x.status === "bad");
  if(signin) items.push(go(`#c/${firstOf(signers).id}`, "c-bad", "", `${signin} need to sign in again`));
  if(failing) items.push(go(`#c/${firstOf(fails).id}`, "c-bad", "", `${failing} couldn't load (retrying)`));
  for(const a of stopped) items.push(go(`#c/${firstOf(a.chars).id}`, "c-bad", "", `${esc(a.label)}: not training`));
  for(const a of short){ const tr = a.chars.filter(x => x.cur).sort((p,q) => q.queueEnd - p.queueEnd)[0];
    items.push(go(`#c/${tr.id}`, "c-warn", "", `${esc(a.label)}: queue <span data-cd="${a.queueEnd}"></span>`)); }
  for(const l of omegaSoon) items.push(go("#accounts", "c-warn", "", `${esc(l)}: ${omegaInfo(l).text}`));
  for(const c of CATS){
    const who = all.filter(x => x.jobs.some(j => j.state === "ready" && j.cat === c.k));
    const k = who.reduce((s,x) => s + x.jobs.filter(j => j.state === "ready" && j.cat === c.k).length, 0);
    if(k) items.push(who.length === 1 ? go(`#c/${who[0].id}`, "", `color:${c.color};background:${c.color}22`, `${k} ${c.name.toLowerCase()} job${k>1?"s":""} ready to deliver`)
      : `<a class="chip" href="#" onclick="setSort('industry');return false" style="text-decoration:none;color:${c.color};background:${c.color}22">${k} ${c.name.toLowerCase()} jobs ready to deliver (${who.length} characters)</a>`);
  }
  return `<div class="attention"><b>Needs attention</b>${items.length ? items.join("") : `<span class="chip c-mute">All clear</span>`}</div>`;
}

function tilesHtml(all, acc){
  const isk = all.reduce((s,x) => s + (x.wallet||0), 0);
  const training = Object.values(acc).filter(a => a.training).sort((a,b) => a.queueEnd - b.queueEnd);
  const stopped = Object.values(acc).filter(a => a.stopped).length;
  const shortest = training[0];
  const withCap = all.filter(x => x.slotCap && x.hasJobs);
  const use = Object.fromEntries(CATS.map(c => [c.k, withCap.reduce((s,x) => s + x.slotUse[c.k], 0)]));
  const cap = Object.fromEntries(CATS.map(c => [c.k, withCap.reduce((s,x) => s + x.slotCap[c.k], 0)]));
  return `<div class="tiles">
    <div class="card tile"><span>Total ISK</span><strong>${fmtISK(isk)}</strong></div>
    <div class="card tile"><span>Shortest skill queue</span>
      ${shortest ? `<strong data-cd="${shortest.queueEnd}" style="color:${shortest.queueLeft < QUEUE_WARN_DAYS*DAY ? "var(--warn)" : "inherit"}"></strong><span>${esc(shortest.label)}${stopped ? ` · <span style="color:var(--bad)">${stopped} not training</span>` : ""}</span>`
                 : `<strong class="small">${stopped ? `<span style="color:var(--bad)">${stopped} not training</span>` : "—"}</strong>`}</div>
    <div class="card tile"><span>Industry slots in use</span><div class="slotrows">${CATS.map(c => `<div style="color:${c.color}"><span>${c.name}</span><b>${use[c.k]}/${cap[c.k]}</b></div>`).join("")}</div></div>
    <div class="card tile"><span>Next Omega expiry</span>${omegaTile(all)}</div></div>`;
}

function toolbarHtml(){
  const opt = (v,t) => `<option value="${v}" ${sortBy===v?"selected":""}>${t}</option>`;
  return `<div class="toolbar"><label for="sortSel" class="muted">View</label>
    <select id="sortSel" onchange="setSort(this.value)">
      ${opt("account","Grouped by account")}${opt("queue","Queue ends soonest")}${opt("industry","Industry: ready first, then finishing soonest")}
      ${opt("fatigue","Jump fatigue: most first")}${opt("wallet","Wallet, highest first")}${opt("name","Name A–Z")}
    </select></div>`;
}
function setSort(v){ sortBy = v; store.set("eve.sort", v); render(); }

const cd = (t, style="") => `<span data-cd="${t}" style="${style}"></span>`;
// one chip per job type (stacked manufacturing / research / reactions) with running and ready counts
function typeChips(x){
  return CATS.map(c => {
    const list = x.jobs.filter(j => j.cat === c.k);
    if(!list.length) return "";
    const run = list.filter(j => j.state === "active").length, ready = list.filter(j => j.state === "ready").length, paused = list.filter(j => j.state === "paused").length;
    const parts = [run ? `${run} running` : "", paused ? `${paused} paused` : "", ready ? `<b>${ready} ready</b>` : ""].filter(Boolean).join(" · ");
    return `<span class="chip sm" title="${c.name}" style="color:${c.color};background:${c.color}22">${c.k} ${parts}</span>`;
  }).join("");
}
function industryCell(x){
  if(!x.hasJobs) return "—";
  return x.jobs.length ? `<div class="readystack">${typeChips(x)}</div>` : `<span class="muted">None</span>`;
}
function jcCell(x){
  if(x.jcHours == null) return "—";
  const when = x.jcReadyAt > Date.now() ? cd(x.jcReadyAt) : `<span style="color:var(--ok)">Ready</span>`;
  return `${when}${x.activeClone ? `<div class="ell muted" style="font-size:12px">${esc(x.activeClone)}</div>` : ""}`;
}
function fatigueCell(x){
  if(x.redLeft) return `<span style="color:var(--bad)" title="Jump activation (red), clear by">Red ≤${cd(x.redEnd)}</span>`;
  if(x.blueLeft) return `<span style="color:var(--accent)" title="Jump fatigue (blue)">Blue ${cd(x.blueEnd)}</span>`;
  return x.hasFatigue ? `<span class="muted">None</span>` : "—";
}

function rowHtml(x, acc, sel){
  const s = rowStatus(x, acc);
  const status = x.cur ? `<span class="ell">${esc(x.training)}</span>` : `<span class="ell${s === "mute" ? " muted" : ""}">${esc(x.label2)}${x.next ? " · " + esc(x.next) : ""}</span>`;

  const shipLine = [x.system, x.ship].filter(Boolean).join(" · ") || "—";
  return `<a class="row ${sel?"sel":""}" href="#c/${x.id}" style="border-left-color:${x.label ? labelColor(x.label) : "transparent"}"${x.label ? ` title="${esc(x.label)}"` : ""}>

    <div style="min-width:0"><div class="nm ell">${esc(x.name)}</div>
      <div class="m st muted" style="font-size:12px"><span class="dot" style="background:${DOT[s]}"></span>${x.cur ? "Queue " : ""}${queue}<span class="ell">· ${fmtISK(x.wallet)}</span></div></div>
    <div class="d st"><span class="dot" style="background:${DOT[s]}"></span>${status}</div>
    <div class="d">${queue}</div>
    <div class="d">${industryCell(x)}</div>
    <div class="d">${fmtISK(x.wallet)}</div>

    <div class="d">${fatigueCell(x)}</div>

      ${x.freeSP ? `<span class="chip sm c-ok">${fmtSP(x.freeSP)} free</span>` : ""}

// key for the character category colors (the colored left edge of each row)
function categoryKey(){
  const cats = [...new Set(Object.keys(chars).map(labelOf).filter(Boolean))].sort((a,b) => a.localeCompare(b));

  return `<div class="catkey"><span class="muted">Categories</span>${cats.map(l => `<span class="catitem"><span class="swatch" style="background:${labelColor(l)}"></span>${esc(l)}</span>`).join("")}<a href="#accounts" style="font-size:12px">Edit</a></div>`;
}
function overviewHtml(all, acc, selId){
  const head = `<div class="thead"><span></span><span>Character</span><span>Training</span><span>Queue ends</span><span>Industry</span><span>Wallet</span><span>Location · ship</span><span>Jump clone</span><span>Jump timers</span></div>`;
  if(sortBy !== "account"){
    const cmp = {
      queue:(a,b) => a.queueEnd - b.queueEnd,
      industry:(a,b) => (b.jobsReady - a.jobsReady) || ((a.nextJob - b.nextJob) || 0) || a.name.localeCompare(b.name),
      fatigue:(a,b) => (b.blueLeft - a.blueLeft) || a.name.localeCompare(b.name),
      wallet:(a,b) => (b.wallet||0) - (a.wallet||0),
      name:(a,b) => a.name.localeCompare(b.name)}[sortBy] || ((a,b) => a.name.localeCompare(b.name));
    return head + all.slice().sort(cmp).map(x => rowHtml(x, acc, x.id === selId)).join("");
  }

  all.forEach(x => (groups[x.account || ""] ||= []).push(x));

    const o = omegaInfo(l), list = groups[l].sort((a,b) => compareChars(a.id, b.id)), a = l ? acc[l] : null;

      ${qinfo}

      list.map(x => rowHtml(x, acc, x.id === selId)).join("");

      <div class="kv"><span>Last login</span><span>${!x.online ? "—" : x.online.online ? `<span style="color:var(--ok)">Online now</span>` : fmtAgo(x.online.last_login)}</span></div>
      ${x.online?.last_logout && !x.online.online ? `<div class="kv"><span>Last logout</span><span>${fmtAgo(x.online.last_logout)}</span></div>` : ""}`)}
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">

}
function fmtAgo(iso){
  const t = Date.parse(iso); if(!t) return "—";
  const ms = Date.now() - t, d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / HOUR), m = Math.floor(ms % HOUR / 6e4);
  const ago = d ? `${d}d ${h}h ago` : h ? `${h}h ${m}m ago` : `${m}m ago`;
  return `${ago} <span class="muted" style="font-size:12px">(${new Date(t).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})})</span>`;
}
function setCloneName(sig, v){ if(!/^[\d,]+$/.test(sig)) return; v = v.trim(); if(v) meta.cloneNames[sig] = v; else delete meta.cloneNames[sig]; saveMeta(); render(); }

      : `<p class="muted" style="font-size:13px">Name your accounts below first.</p>`}
    <h3>Characters: account, order within the account, category</h3>
    <datalist id="acctList">${acctLabels.map(l => `<option value="${esc(l)}">`).join("")}</datalist>
    <datalist id="labelList">${charLabels.map(l => `<option value="${esc(l)}">`).join("")}</datalist>
    ${sorted.map(id => `<div class="srow"><label for="a_${id}">${esc(chars[id].name)}</label>
      <input id="a_${id}" list="acctList" placeholder="Account name" value="${esc(accountOf(id))}" onchange="setAccount('${id}', this.value)">
      <input type="number" min="1" inputmode="numeric" placeholder="#" aria-label="Order of ${esc(chars[id].name)}" style="flex:0 0 76px" value="${val(meta.charOrder[id])}" onchange="setCharOrder('${id}', this.value)">
      <input list="labelList" placeholder="Category" aria-label="Category for ${esc(chars[id].name)}" style="flex:0 1 160px" value="${esc(labelOf(id))}" onchange="setLabel('${id}', this.value)"></div>`).join("")}
    <h3>Category colors</h3>
    ${charLabels.length ? charLabels.map((l,i) => `<div class="srow"><label for="lc_${i}">${labelChip(l)}</label>
      <select id="lc_${i}" onchange="setLabelColor(${i}, this.value)">${Object.keys(LABEL_COLORS).map(c => `<option value="${c}" ${(meta.labelColor[l] || "gray") === c ? "selected" : ""}>${c[0].toUpperCase() + c.slice(1)}</option>`).join("")}</select></div>`).join("")
      : `<p class="muted" style="font-size:13px">Give characters a category above (e.g. "Main alliance", "Neutral alt") to pick its color here. On the overview, each character's row gets a colored left edge, with a key above the list.</p>`}
  </div>`;
}
function saveMeta(){ store.set("eve.meta", meta); }
const cleanNum = v => { v = String(v).trim(); return v === "" || isNaN(v) ? undefined : Math.max(0, Math.round(+v)); };
function setAccount(id, v){ v = v.trim(); if(v) meta.accountOf[id] = v; else delete meta.accountOf[id]; saveMeta(); render(); }
function setLabel(id, v){ v = v.trim(); if(v) meta.charLabel[id] = v; else delete meta.charLabel[id]; saveMeta(); render(); }
function setLabelColor(i, v){ const l = charLabels[i]; if(!l || !LABEL_COLORS[v]) return; meta.labelColor[l] = v; saveMeta(); render(); }
function setCharOrder(id, v){ const n = cleanNum(v); if(n === undefined) delete meta.charOrder[id]; else meta.charOrder[id] = n; saveMeta(); render(); }
function setAcctOrder(i, v){ const l = acctLabels[i]; if(!l) return; const n = cleanNum(v); if(n === undefined) delete meta.accountOrder[l]; else meta.accountOrder[l] = n; saveMeta(); render(); }
function setAlpha(i, on){
  const l = acctLabels[i]; if(!l) return;
  if(on) meta.omega[l] = "alpha"; else delete meta.omega[l];
  saveMeta(); render();
}
function setOmega(i, v){
  const l = acctLabels[i]; if(!l) return;
  if(v) meta.omega[l] = v; else delete meta.omega[l];
  saveMeta(); render();
}

function tick(){
  const now = Date.now();
  document.querySelectorAll("[data-cd]").forEach(el => el.textContent = fmtDur(+el.dataset.cd - now));
  document.querySelectorAll("[data-start]").forEach(el => {
    const s=+el.dataset.start, e=+el.dataset.end;
    el.style.width = Math.max(0, Math.min(100, (now-s)/(e-s)*100)).toFixed(1) + "%";
  });
  if(isPaused()){
    document.getElementById("synced").textContent = `Paused: ${pauseReason}. Resuming ${new Date(pausedUntil).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}`;
  }else if(lastSync){
    const m = Math.floor((now-lastSync)/6e4);
    document.getElementById("synced").textContent = syncing ? "Syncing…" : m < 1 ? "Synced just now" : `Synced ${m}m ago`;
  }else if(syncing) document.getElementById("synced").textContent = "Syncing…";
}

function removeChar(id){
  if(!confirm(`Remove ${chars[id].name} from this device?`)) return;
  delete chars[id]; delete data[id]; delete meta.accountOf[id];
  store.set("eve.chars", chars); saveMeta();
  location.hash = "";
  render();
}

/* ---------- Boot ---------- */
document.getElementById("addBtn").onclick = startLogin;
document.getElementById("refreshBtn").onclick = refreshAll;
document.getElementById("settingsBtn").onclick = () => { location.hash = "#accounts"; };
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
document.addEventListener("visibilitychange", () => {
  if(document.hidden) return;
  if(Date.now() - lastSync > 2 * 60e3) refreshAll();   // EVE caches this data for up to 2 minutes anyway
  else schedulePoll();                                   // resume the 5-minute cycle
});
(async () => {
  try{ await handleCallback(); }
  catch(e){ document.getElementById("globalErr").textContent = e.message; }
  render();
  setInterval(tick, 1000);
  if(!document.hidden) await refreshAll();   // opened in a background tab: wait until it's looked at (visibilitychange)
})();
</script>
</body>
</html>
